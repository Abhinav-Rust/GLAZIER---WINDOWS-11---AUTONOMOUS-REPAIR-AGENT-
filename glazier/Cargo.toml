[package]
name = "glazier"
version = "0.1.0"
edition = "2021"
description = "A deterministic, symbolic Windows 11 repair agent grounded in classical Indian logic."
authors = ["Abhinav"]
license = "MIT"
repository = "https://github.com/Abhinav-Rust/drishti"
keywords = ["windows", "repair", "ai", "symbolic", "logic"]
categories = ["command-line-utilities", "os::windows-apis"]

[dependencies]
wmi = "0.13"
surrealdb = { version = "1.5", features = ["kv-mem", "kv-rocksdb"] }
pest = "2.7"
pest_derive = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "1"
walkdir = "2.5.0"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
windows = { version = "0.54", features = [
    "Win32_System_Registry",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Services",
    "Win32_UI_Shell"
] }

[[bin]]
name = "test_parse"
path = "src/bin_test_parse.rs"
